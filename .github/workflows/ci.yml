name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check, test and package
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Real browser and MCP regression
        shell: pwsh
        run: python scripts/test-automation.py --exe target/debug/WorkLink.exe --headless-only
      - name: Match Edge models and verify ChatGPT URLs
        shell: pwsh
        run: ./scripts/test-edge-chat.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: WorkLink-windows-x64
          path: |
            releases/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
